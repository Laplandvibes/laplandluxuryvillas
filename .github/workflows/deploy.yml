name: Deploy to Cloudflare Pages

# =============================================================================
# Self-contained build: this repo vendors everything it needs from the private
# parent monorepo (Laplandvibes/lv-ops), so a plain checkout builds green and
# NO cross-repo PAT is required.
#
# HISTORY (2026-07-26): CI had been red on every push since 2026-07-13. Two
# separate causes, both fixed:
#   1. `npm ci` died with EUSAGE — package-lock.json was stuck at its 2026-07-07
#      state while package.json had gained vite-plugin-compression2 (+3 transitive).
#   2. The vendoring of shared/ was INCOMPLETE. src/shared/ existed, but
#      src/pages/NotFound.tsx still imported '../../../shared/NotFound',
#      src/index.css scanned '../../shared/**' and the build script called
#      '../_prerender_routes.mjs' — all three reach OUTSIDE this repo.
#      An earlier attempt concluded a cross-repo PAT was the only way. It is
#      not: laplandtours / laplandnightlife / laplandwellness and the hub all
#      build green from a plain checkout by vendoring shared/ AND
#      scripts/_prerender_routes.mjs. This repo now follows that same pattern.
#
# MAINTAINING THE VENDORED COPY
#   Source of truth is the monorepo ../shared/ + ../_prerender_routes.mjs.
#   After editing those, refresh this repo's copies and commit them:
#     cp ../shared/<file> src/shared/<file>
#     cp ../_prerender_routes.mjs scripts/_prerender_routes.mjs
#   (The hub automates this with scripts/sync-shared.mjs.)
#   Keep imports pointing at '../shared/...' — never '../../../shared/...'.
# =============================================================================

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time per branch. A push that arrives while a deploy is
# running waits for it; if a newer push arrives meanwhile, the older waiting
# run is dropped (the newer commit contains it), so the newest commit always
# deploys last. Without this, two pushes a few minutes apart deployed in
# parallel and whichever finished last won production.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run build

      # ─── LV-PORTIT-CI (13.11.2026) ──────────────────────────────────────────────────────
      # lv-opsin dist-portit ennen julkaisua, sama ajuri ja samat portit kuin deploy-safe.sh:ssa
      # (node scripts/portti.mjs --site <sivusto> --taso dist). lv-ops on yksityinen ja luetaan vain luku
      # -avaimella (lv-opsin deploy key, salaisuus LV_OPS_DEPLOY_KEY). Kaatunut portti PYSÄYTTÄÄ julkaisun.
      # Jos lv-opsia ei saada (avain puuttuu, GitHub-katko), julkaisu jatkuu varoituksella.
      # Hätäohitus: Actions-muuttuja LV_PORTIT_POIS=1 (repo tai organisaatio); kirjaa syy.
      - name: LV-portit — lv-ops (vain luku)
        id: lvops
        if: ${{ vars.LV_PORTIT_POIS != '1' }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Laplandvibes/lv-ops
          ssh-key: ${{ secrets.LV_OPS_DEPLOY_KEY }}
          path: _lv-ops

      - name: LV-portit — Node 24 (sama kuin deploy-safe.sh)
        if: ${{ vars.LV_PORTIT_POIS != '1' && steps.lvops.outcome == 'success' }}
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: LV-portit — dist
        if: ${{ vars.LV_PORTIT_POIS != '1' && steps.lvops.outcome == 'success' }}
        env:
          SIVUSTO_DIR: laplandluxuryvillas-new
        run: |
          # Portit etsivät sivuston lv-opsin juuresta (<lv-ops>/<sivusto>), kuten Vesan koneella.
          mv _lv-ops "$RUNNER_TEMP/lv-ops"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/lv-ops/$SIVUSTO_DIR"
          cd "$RUNNER_TEMP/lv-ops"
          npm ci --no-audit --no-fund
          node scripts/portti.mjs --site "$SIVUSTO_DIR" --taso dist

      # Julkaisuvaihe ajetaan sivuston omalla Node-versiolla, kuten ennen tätä lohkoa.
      - name: LV-portit — sivuston oma Node takaisin
        if: ${{ vars.LV_PORTIT_POIS != '1' && steps.lvops.outcome == 'success' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: LV-portit — ohitettu
        if: ${{ vars.LV_PORTIT_POIS == '1' || steps.lvops.outcome != 'success' }}
        run: echo "::warning::LV-portit ohitettu (LV_PORTIT_POIS='${{ vars.LV_PORTIT_POIS }}', lv-ops-haku='${{ steps.lvops.outcome }}')"
      # ─── /LV-PORTIT-CI ───────────────────────────────────────────────────────────────────

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=laplandluxuryvillas-com --branch=main
